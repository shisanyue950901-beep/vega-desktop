name: Build vega-desktop (Windows x64)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://github.com/rustdesk/rustdesk/discussions/7503
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.3"
  UPLOAD_ARTIFACT: "true"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: windows-2022,
              platform: x64,
            }
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Check vega.exe exists
        shell: pwsh
        run: |
          $exe = "./rustdesk/vega.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "vega.exe not found at $exe"
            Get-ChildItem -Path ./rustdesk -Recurse -Filter *.exe | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Get-Item $exe | Format-List FullName, Length

      - name: Copy LICENCE and NOTICE-VEGA.md into rustdesk dir
        shell: bash
        run: |
          cp -f LICENCE ./rustdesk/LICENCE
          cp -f NOTICE-VEGA.md ./rustdesk/NOTICE-VEGA.md
          ls -l ./rustdesk/LICENCE ./rustdesk/NOTICE-VEGA.md

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/vega.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/vega-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
          # Vega: 下载给用户的就是安装程序——文件名以 install.exe 结尾时双击直接进入安装页。
          cp ./SignOutput/vega-${{ env.VERSION }}-${{ matrix.job.arch }}.exe ./SignOutput/Vega-Install.exe

      - name: UI 截图
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $exe = @(
            "./flutter/build/windows/x64/runner/Release/vega.exe",
            "./rustdesk/vega.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "vega.exe not found, skip UI screenshot"
            Get-ChildItem -Path ./rustdesk -Recurse -Filter *.exe | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          # 截图按中文界面渲染（与国内用户一致）：写入 LocalConfig 的 lang 选项。
          $cfgDir = Join-Path $env:APPDATA "Vega\config"
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          Set-Content -Path (Join-Path $cfgDir "Vega_local.toml") -Encoding utf8 -Value "[options]`nlang = 'zh-cn'`ntheme = 'light'`n"
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class VegaWin {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
          }
          "@
          # Vega: 先浅色、再深色各截一张
          function Invoke-VegaShot([string]$name, [string[]]$exeArgs = @()) {
            Write-Host "Launching $exe $exeArgs"
            if ($exeArgs.Count -gt 0) { $proc = Start-Process -FilePath $exe -ArgumentList $exeArgs -PassThru } else { $proc = Start-Process -FilePath $exe -PassThru }
            $out = $null
            $ready = $false
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) { break }
              try { $proc.Refresh() } catch { break }
              if ($proc.MainWindowHandle -ne [IntPtr]::Zero) {
                $ready = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              Write-Host "vega window not ready within 60s or process exited, skip UI screenshot"
              if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
              return
            }
            try {
              $h = $proc.MainWindowHandle
              [VegaWin]::ShowWindow($h, 9) | Out-Null
              [VegaWin]::SetForegroundWindow($h) | Out-Null
              Start-Sleep 3
              $proc.Refresh()
              if ($proc.HasExited -or $proc.MainWindowHandle -eq [IntPtr]::Zero) {
                Write-Host "vega exited before capture, skip UI screenshot"
                return
              }
              $r = New-Object VegaWin+RECT
              [VegaWin]::GetWindowRect($proc.MainWindowHandle, [ref]$r) | Out-Null
              $w = $r.R - $r.L; $hgt = $r.B - $r.T
              if ($w -le 0 -or $hgt -le 0) { Write-Host "bad window rect, skip"; return }
              Add-Type -AssemblyName System.Drawing
              $bmp = New-Object System.Drawing.Bitmap $w, $hgt
              $gfx = [System.Drawing.Graphics]::FromImage($bmp)
              try {
                $gfx.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hgt))
                New-Item -ItemType Directory -Force -Path ./screenshots | Out-Null
                $out = Join-Path (Resolve-Path ./screenshots) $name
                $bmp.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $gfx.Dispose()
                $bmp.Dispose()
              }
            } finally {
              if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            }
            if ($out) { Get-Item $out | Format-List FullName, Length }
          }
          try { Invoke-VegaShot "shot-home.png" } catch { Write-Host "light capture failed: $_" }
          Set-Content -Path (Join-Path $cfgDir "Vega_local.toml") -Encoding utf8 -Value "[options]`nlang = 'zh-cn'`ntheme = 'dark'`n"
          Get-Process vega -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          try { Invoke-VegaShot "shot-dark.png" } catch { Write-Host "dark capture failed: $_" }
          Get-Process vega -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          try { Invoke-VegaShot "shot-install-dark.png" @("--install") } catch { Write-Host "install dark capture failed: $_" }
          Set-Content -Path (Join-Path $cfgDir "Vega_local.toml") -Encoding utf8 -Value "[options]`nlang = 'zh-cn'`ntheme = 'light'`n"
          Get-Process vega -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          try { Invoke-VegaShot "shot-install.png" @("--install") } catch { Write-Host "install light capture failed: $_" }

      - name: Upload vega-screenshots
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vega-screenshots
          path: ./screenshots/*.png
          if-no-files-found: warn

      - name: Upload vega-windows-x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vega-windows-x64
          path: |
            ./SignOutput/vega-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
            ./SignOutput/Vega-Install.exe
            ./rustdesk/
          if-no-files-found: error
